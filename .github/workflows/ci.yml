name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'packages/**/package.json', 'packages/**/tsconfig.json', 'packages/**/src/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate node registries
        run: bun run generate:node-registries

      - name: Audit React Compiler boundaries
        run: bun run audit:react-compiler-boundaries

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck:app

      - name: Build node packages
        run: bun run build:nodes

      - name: Build packages
        run: bun run build:packages:turbo

      - name: Audit target node manifest
        run: bun run audit:target-node-manifest

      - name: Test target node manifest surface scan
        run: bun run test:target-node-manifest

      - name: Inventory the legacy HTTP/Operation surface
        run: bun run audit:http-surface -- --side legacy --force

      - name: Test the plugin manifest gate
        run: bun run test:plugin-manifests

      - name: Test the node definition gate
        run: bun run test:node-definitions

      - name: Audit node definition coverage
        run: bun run audit:node-definitions

      - name: Test the node UI independence gate
        run: bun run test:node-ui-independence

      - name: Audit node UI independence from Xiranite-only state
        run: bun run audit:node-ui-independence

      - name: Test the node help text gate
        run: bun run test:node-help-text

      - name: Audit node definition help text against the node dictionaries
        run: bun run audit:node-help-text
      - name: Test the node interaction parity gate
        run: bun run test:node-interaction-parity

      - name: Audit each node's interaction.ts against its definition
        run: bun run audit:node-interaction-parity

      - name: Test the node CLI surface inventory
        run: bun run test:node-cli-surface

      - name: Audit the node CLI surface against its baseline
        run: bun run audit:node-cli-surface

      - name: Test the TUI theme table generator
        run: bun run test:tui-theme-table

      - name: Audit the TUI theme table against its producer
        run: bun run audit:tui-theme-table

      - name: Test the migration analyzers
        run: bun run --cwd packages/tauri-migrate test

      - name: Audit node architecture
        run: bun run audit:node-architecture

      - name: Test the QuickJS host operation audit
        run: bun run test:quickjs-host-ops

      # The gate takes the host operation vocabulary from the compiled `HostOperation::ALL`, not from
      # source text, so this step builds one small bin first (`-j 1`, sccache when present).
      - name: Audit the QuickJS host operations against the shim surface
        run: bun run audit:quickjs-host-ops

  # The desktop host is Rust now (cargo build -p xiranite-desktop), so the only Go left in the
  # module is the browser-extension native messaging host under cmd/ and internal/. This job keeps
  # that cross-compiling for the two platforms a Linux runner can reach; it needs no Bun runtime
  # asset because nothing in Go launches one any more.
  native-host-compile:
    name: Browser native host compiles (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            goos: linux
            goarch: amd64
          - label: windows-x64
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The only Go that ships now is the browser-extension native messaging host: the Wails
      # desktop host, its embedded Bun runtime and the backend subprocess it launched are deleted,
      # so the desktop binary is built by the Rust job (cargo build -p xiranite-desktop) instead.
      - name: Compile
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -mod=mod ./cmd/... ./internal/...

  # The two comments above this job say the desktop host "is built by the Rust job". There was no Rust job:
  # this file ran no `cargo` at all, so nothing in CI compiled or tested the QuickJS executor, the scripted
  # node table or the host crate that the whole rewrite is about. This job is that missing gate.
  #
  # `bun run build:node-bundles` is a prerequisite, not decoration: `crates/xiranite-builtin-host/build.rs`
  # stages each node's bundle out of the gitignored `artifacts/node-bundles/`, and on a tree without those
  # files it panics with its own instruction to run that command. Measured, not inferred — a clean checkout
  # of this branch on Windows failed exactly there (docs/migration/quickjs-substrate-evaluation.md §20).
  #
  # Deliberately NOT covered here yet: `-p xiranite-desktop`. On Windows it needs
  # `crates/xiranite-desktop/icons/icon.ico`, which the branch does not carry (`tauri-build` refuses without
  # it, while macOS never asks) — that is a release blocker to fix in the desktop crate, not something to
  # paper over by leaving the host out of CI.
  rust-host:
    name: Rust host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the node bundles the host links
        run: bun run build:node-bundles

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'crates/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `-j 1` because the repository builds native code serially (one Cargo job), on a runner whose
      # memory is not ours to size.
      - name: QuickJS executor unit tests
        shell: bash
        run: cargo test --locked -p xiranite-quickjs-executor --lib -j 1

      - name: Scripted node registration table
        shell: bash
        run: cargo test --locked -p xiranite-scripted-nodes --all-targets -j 1

      - name: Built-in host crate compiles
        shell: bash
        run: cargo check --locked -p xiranite-builtin-host -j 1
