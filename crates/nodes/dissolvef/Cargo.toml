[package]
name = "dissolvef"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "DissolveF node core as the node's single WASM business implementation (ADR-0069): nested/media/archive/direct folder dissolution with conflict planning and undo history."

[lib]
name = "dissolvef"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vocabulary and ABI codes only; this crate stays dependency-free so the same types
# compile into the wasm plugin and into the host (ADR-0068).
xiranite-plugin-api = { path = "../../xiranite-plugin-api" }
# The built-in registration and the shared host seam (ADR-0073). Adds no runtime: `inventory` is a
# link-time table, so a native node still carries no executor of its own.
xiranite-node-registry = { path = "../../xiranite-node-registry" }

[dev-dependencies]
# Only the parity test reaches for these: the crate's business code must stay free of a host,
# an executor and a real filesystem (ADR-0073 keeps that split where ADR-0068 put it).
tempfile = "3"
xiranite-core = { path = "../../xiranite-core" }
xiranite-native-host = { path = "../../xiranite-native-host" }
