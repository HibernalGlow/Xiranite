# Xiranite's own declaration for this plugin — the frontend-only form of
# `docs/plugin-architecture.md` §2.1. It is what a Plugin Manager would read to register the remote;
# `dist/mf-manifest.json` is the Module Federation runtime's own metadata and is not this file.
#
# The `[backend]` half is read by `crates/xiranite-node-runtime/src/manifest.rs`; a manifest without
# `[backend]` is a frontend-only plugin, so it never reaches that reader — the absence here is the
# declaration, not an omission. The `[frontend]` half is read by
# `parseFrontendPluginManifest` in `@xiranite/contract` (`packages/contract/src/pluginManifest.ts`),
# which `src/plugins/pluginManifestInstall.ts` feeds into the host's install record, and whose fixture
# this very file is (`packages/contract/src/pluginManifest.test.ts`).
id = "poc-frontend"
name = "Xiranite MF POC"
version = "0.1.0"
frontend_api = "1.0"

[frontend]
runtime = "module-federation"
manifest = "dist/mf-manifest.json"
alias = "poc_frontend"
entry_type = "module"
share_scope = "default"
# A range, not a version: the reader only understands exact X.Y.Z, ^ and ~ (see
# docs/plugin-architecture.md §2.1 — `1.0` here used to be a bare version and would be refused).
required_api = "^1.0"

[[frontend.exposes]]
id = "poc-frontend.entry"
module = "./entry"

[permissions]
filesystem = []
network = []
clipboard = false
backend = false
