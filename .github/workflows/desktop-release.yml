name: Desktop Release

# One matrix builds every desktop host: Windows, macOS and Linux, each in two
# variants. `embedded` ships the Bun runtime inside the executable, `system`
# is compiled with the no_bun tag and resolves Bun from PATH at runtime.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_CACHE_DIR: .turbo

jobs:
  build-desktop:
    name: ${{ matrix.platform }} (${{ matrix.embedded && 'embedded-bun' || 'system-bun' }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      # Every job is listed on purpose. `include` entries that share no key with
      # a matrix variable are appended as separate configurations instead of
      # being crossed with it, so relying on that expansion would produce jobs
      # with an empty runs-on.
      matrix:
        include:
          - platform: windows-x64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            embedded: true
            windowed: true
            archive: none
            output: build/wails/Xiranite.exe
          - platform: windows-x64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            embedded: false
            windowed: true
            archive: none
            output: build/wails/Xiranite.exe
          - platform: macos-arm64
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
            embedded: true
            windowed: false
            archive: app-bundle
            output: build/wails/Xiranite
          - platform: macos-arm64
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
            embedded: false
            windowed: false
            archive: app-bundle
            output: build/wails/Xiranite
          - platform: linux-x64
            runs-on: ubuntu-24.04
            goos: linux
            goarch: amd64
            embedded: true
            windowed: false
            archive: tar.gz
            output: build/wails/Xiranite
          - platform: linux-x64
            runs-on: ubuntu-24.04
            goos: linux
            goarch: amd64
            embedded: false
            windowed: false
            archive: tar.gz
            output: build/wails/Xiranite

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve pinned Bun version
        id: bunver
        shell: bash
        # package.json#packageManager is the one place the toolchain is pinned;
        # it drives setup-bun here and the runtime embedded into releases below.
        # The step output feeds `with:`, which must not depend on $GITHUB_ENV
        # being visible through the env context.
        run: |
          set -euo pipefail
          version="$(sed -nE 's/.*"packageManager": "bun@([0-9.]+)".*/\1/p' package.json)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "BUN_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          # Wails v3 without the gtk3 tag links GTK4 + WebKitGTK 6: its cgo
          # directives ask pkg-config for gtk4, webkitgtk-6.0, libsoup-3.0 and
          # gio-unix-2.0, so the legacy webkit2gtk-4.1 headers are not enough.
          sudo apt-get install -y --no-install-recommends \
            gcc pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libglib2.0-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bunver.outputs.version }}

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-desktop-${{ matrix.platform }}-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'packages/**/package.json', 'packages/**/tsconfig.json', 'packages/**/src/**', 'scripts/**', 'src/**', 'vite.config.ts', 'go.mod', 'go.sum', '*.go', 'build/windows/**') }}
          restore-keys: |
            ${{ runner.os }}-turbo-desktop-${{ matrix.platform }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-desktop-${{ matrix.platform }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate node registries
        run: bun run generate:node-registries

      # The turbo node filter still builds disabled nodes when an enabled node
      # depends on them, and clipm's contract export pins a CUDA-only torch wheel
      # that cannot resolve on macOS. This builder skips the nodes that
      # xiranite.build.toml disables and still fails on any enabled one.
      - name: Build packages and enabled nodes
        run: bun scripts/build-packages-lazy.ts

      - name: Typecheck app
        run: bun run typecheck:app

      - name: Build frontend
        run: bunx vite build

      - name: Build backend JS
        run: bun run build:backend:js

      # Only win32-x64 has a committed native prebuilt store, so the other
      # platforms build theirs from source, one binding at a time: a binding that
      # cannot build must not remove the ones that can.
      - name: Setup Rust toolchain
        if: matrix.goos != 'windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Build platform native assets
        if: matrix.goos != 'windows'
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          for id in arcthumb czkawka findz; do
            if bun run refresh:native-assets -- --only="$id"; then
              echo ":white_check_mark: native asset $id packaged" >> "$GITHUB_STEP_SUMMARY"
            else
              missing+=("$id")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo ":warning: ${{ matrix.platform }} ships without native assets for ${missing[*]}; those nodes report unavailable capabilities." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare embedded native assets
        run: bun run build:native-assets

      - name: Stage embedded Bun runtime
        if: matrix.embedded
        shell: bash
        run: bun run fetch:bun-runtime -- --os "${{ matrix.goos }}" --arch "${{ matrix.goarch }}" --version "$BUN_VERSION"

      - name: Generate Windows resources
        if: matrix.windowed
        run: bun run wails:syso

      - name: Build desktop host
        shell: bash
        run: |
          set -euo pipefail
          tags="production"
          ldflags="-w -s"
          if [ "${{ matrix.embedded }}" = "true" ]; then
            ldflags="$ldflags -X main.embeddedBunVersion=$BUN_VERSION"
          else
            tags="production,no_bun"
          fi
          if [ "${{ matrix.windowed }}" = "true" ]; then
            ldflags="$ldflags -H windowsgui"
          fi
          go build -mod=mod -tags "$tags" -ldflags "$ldflags" -o "${{ matrix.output }}" .

      - name: Verify embedded Bun runtime executes
        if: matrix.embedded
        shell: bash
        run: |
          set -euo pipefail
          go test -mod=mod -count=1 -tags production \
            -ldflags "-w -s -X main.embeddedBunVersion=$BUN_VERSION" \
            -run 'EmbeddedBunRuntime|PackagedBackendBoots' .

      # The other half of the release: prove the system-Bun package really carries
      # no runtime and still accepts the Bun the user installed.
      - name: Verify system Bun runtime resolution
        if: ${{ !matrix.embedded }}
        shell: bash
        env:
          # Turn the gate's "no Bun on PATH" skip into a hard failure: this job
          # installs Bun, so a skip here would mean a broken release check.
          XIRANITE_REQUIRE_RELEASE_RUNTIME: "1"
        run: |
          set -euo pipefail
          go test -mod=mod -count=1 -tags production,no_bun \
            -ldflags "-w -s -X main.nodeAppMinimumBunVersion=$BUN_VERSION" \
            -run SystemBunVariant .

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch keeps the branch name in GITHUB_REF_NAME, which may
          # contain a slash and would break the asset path.
          version="${GITHUB_REF_NAME//\//_}"
          variant=$([ "${{ matrix.embedded }}" = "true" ] && echo "embedded-bun" || echo "system-bun")
          base="Xiranite-${version}-${{ matrix.platform }}-${variant}"
          mkdir -p release
          case "${{ matrix.archive }}" in
            app-bundle)
              # A bare Mach-O binary is not a macOS release: Finder cannot launch
              # it and NSApplication expects a bundle, so wrap the host, ad-hoc
              # sign it, and archive with ditto so bundle metadata survives.
              app_version="$(printf '%s' "$version" | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"
              if [ -z "$app_version" ]; then
                app_version="$(sed -nE 's/.*"version": "([^"]+)".*/\1/p' package.json | head -1)"
              fi
              bundle="build/macos/Xiranite.app"
              bun scripts/package-macos-bundle.ts --binary "${{ matrix.output }}" --output "$bundle" --version "$app_version"
              ditto --norsrc --noextattr -c -k --keepParent "$bundle" "$PWD/release/${base}.zip"
              ;;
            tar.gz)
              tar -C "$(dirname "${{ matrix.output }}")" -czf "$PWD/release/${base}.tar.gz" "$(basename "${{ matrix.output }}")"
              ;;
            *)
              cp "${{ matrix.output }}" "release/${base}.exe"
              ;;
          esac
          ls -l release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.embedded && 'embedded-bun' || 'system-bun' }}
          if-no-files-found: error
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="Xiranite ${tag} for Windows x64, macOS arm64 and Linux x64. Each platform ships an embedded-Bun build (default, no Bun install needed) and a system-Bun build that uses the Bun already on PATH. The macOS builds are .app bundles inside the zip; they are ad-hoc signed, not notarized, so the first launch needs an explicit override in Gatekeeper. The Linux build is a plain executable and needs GTK4 plus WebKitGTK 6 present on the host."
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Xiranite ${tag}" --notes "$notes"
          find release -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$tag" --clobber
          gh release view "$tag"
