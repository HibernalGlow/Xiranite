[package]
name = "xiranite-loopback-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "The Xiranite loopback backend host: binds the Axum /operations server on 127.0.0.1 with an ephemeral port and a per-instance bearer token, stages the node runtime from the environment, and publishes the channel. Shell-agnostic — no Tauri in this graph (ADR-0063, ADR-0065)."

[lib]
name = "xiranite_loopback_host"
path = "src/lib.rs"

# The headless development host. Declared explicitly rather than left to auto-discovery so the binary
# name is a stated contract: `xiranite-dev-host` is what a dev script spawns and reads one
# `XIRANITE_CHANNEL` line from.
[[bin]]
name = "xiranite-dev-host"
path = "src/bin/dev_host.rs"

[dependencies]
xiranite-api = { path = "../xiranite-api" }
xiranite-core = { path = "../xiranite-core" }
# The launcher is not optional: a host built without it could start operations and finish none of
# them (ADR-0069, with the built-in registry standing in for the retired wasm staging per ADR-0074).
xiranite-builtin-host = { path = "../xiranite-builtin-host" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-instance bearer token (ADR-0065). This is a direct dependency now rather than a transitive one
# borrowed through Tauri's tree, because this crate must build with no windowing stack in the graph.
getrandom = "0.3"
