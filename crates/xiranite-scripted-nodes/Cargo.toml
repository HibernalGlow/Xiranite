[package]
name = "xiranite-scripted-nodes"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
publish = false
description = "The registration site for node implementations that run as TypeScript bundles inside the host's QuickJS executor (ADR-0074 §1/§6): one table, generated from the built bundle index plus the retained-node manifest, so a node enters the shipping binary through data rather than a hand-written crate."

# A member of the repository root workspace, so `cargo test --workspace` reaches the generated table and
# its three coverage tests. The interim `[workspace]` root this crate carried while it was still outside the
# member list is gone: keeping it while being named in `members` fails with "multiple workspace roots found".

[dependencies]
xiranite-node-registry = { path = "../xiranite-node-registry" }
xiranite-quickjs-executor = { path = "../xiranite-quickjs-executor" }

[dev-dependencies]
serde_json = "1"
xiranite-plugin-api = { path = "../xiranite-plugin-api" }
