id = "transq"
version = "0.1.0"
backend_api = "1.0"

[backend]
runtime = "extism"
entry = "transq.wasm"
runtime_version = "1.0.0"
memory_max_pages = 64
# ADR-0071: there is no `xiranite.fs.*` any more. The host opens this plugin with WASI and preopens
# the roots below, and `src/transq_std_fs.rs` reaches the machine with `std::fs` against them.
# TransQ's roots are the translation workspaces the operator pastes into the `paths` path-list field
# of `definition.json`, so the grant is per operation and is named by that field rather than by a
# literal directory; the host binds each authorized root at its own real path, which is the exact
# text the request already carries. `ro:` in front of an entry would make that preopen read-only —
# TransQ copies, moves and deletes, so its workspace roots must stay writable.
allowed_paths = [
  "{operation:paths}",
]
allowed_hosts = []
# ADR-0068's vocabulary as closed by ADR-0071. TransQ imports two of the nine names: the event stream
# and the cooperative yield. `xiranite.scheduler.acquire` is deliberately absent (the host classifies
# this node's resource class), and `xiranite.process.run` is not needed because the organizer shells
# out to nothing.
host_functions = [
  "xiranite.operation.checkpoint",
  "xiranite.operation.emit",
]
