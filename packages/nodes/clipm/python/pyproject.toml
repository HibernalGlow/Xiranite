[project]
name = "xiranite-clipm"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anyio==4.14.2",
  "mcp==2.0.0",
  "numpy==1.26.4",
  "pillow==12.0.0",
  "portalocker==3.2.0",
  "pydantic==2.13.4",
  "safetensors==0.8.0",
  "scikit-learn==1.7.1",
  "sqids==0.5.2",
  "torch==2.4.0+cu121",
  "transformers==4.54.1",
]

[project.optional-dependencies]
pilot-import = [
  "joblib==1.5.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xiranite_clipm"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
