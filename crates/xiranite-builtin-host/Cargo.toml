[package]
name = "xiranite-builtin-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "The production OperationLauncher for built-in nodes: a linked-in registry (native Rust or a QuickJS TS bundle) driven by the /operations routes (ADR-0074)."

[dependencies]
# The trait this crate implements, plus the request type the routes hand over.
xiranite-api = { path = "../xiranite-api" }
xiranite-core = { path = "../xiranite-core" }
xiranite-native-host = { path = "../xiranite-native-host" }
xiranite-node-registry = { path = "../xiranite-node-registry" }
xiranite-plugin-api = { path = "../xiranite-plugin-api" }
xiranite-quickjs-executor = { path = "../xiranite-quickjs-executor" }
xiranite-scripted-nodes = { path = "../xiranite-scripted-nodes" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
# The same test stack `crates/xiranite-api` uses to drive the router without a socket.
axum = "0.8"
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5", features = ["util"] }
