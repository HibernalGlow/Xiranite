[package]
name = "xiranite-plugin-soundw"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "SoundW microphone/recording-device switching through the SoundSwitch CLI, ported from packages/nodes/soundw to a standalone Extism WASM plugin (ADR-0063, ADR-0071)."

# Standalone workspace root (ADR-0063 puts plugins in `plugins/<id>/`). The root
# workspace in `Cargo.toml` excludes `plugins/*` on purpose: the `[profile.release]`
# below is tuned for wasm size and would be ignored inside a shared workspace.
[workspace]

[lib]
name = "xiranite_plugin_soundw"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[features]
default = []
# `wasm` adds the Extism boundary (`src/extism_boundary.rs`), the host-backed runtime
# (`src/host_runtime.rs`) and the exported entry points (`src/plugin.rs`). They import
# `extism:host/env` and `extism:host/user` and therefore only compile for a wasm32
# target; `cargo test` runs the same pure core the isolate will run.
wasm = []

[dependencies]
# Justification for not staying std-only: the preserved operation protocol is JSON with
# camelCase keys (`nodeRunRequestSchema` / `nodeRunResponseSchema`,
# `packages/shared/src/index.ts:140-151`), and `SoundwData`'s field names are the ones the
# React card already reads (`packages/nodes/soundw/src/core.ts:5`). Hand-writing a JSON
# reader/printer for that is the generic infrastructure AGENTS.md says not to re-invent.
# MIT/Apache-2.0, and the only dependency set the sibling plugin crates already use.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
# `panic = "abort"` stays off: `cargo test --release` has to keep working, and Extism
# already surfaces a wasm panic to the host as a trap.
