id = "snf"
version = "0.1.0"
backend_api = "1.0"

[backend]
runtime = "extism"
entry = "snf.wasm"
runtime_version = "1.0.0"
memory_max_pages = 256
# ADR-0071: there is no `xiranite.fs.*` any more. The host opens this plugin with WASI and preopens
# the roots below, and `src/std_file_system.rs` reaches the machine with `std::fs` against them.
# SNF's roots are the library roots and artist folders the operator pastes into the `pathsText`
# path-list field of `definition.json`, so the grant is per operation and is named by that field
# rather than by a literal directory; the host binds each authorized root at its own real path, which
# is the exact text the request already carries. `ro:` in front of an entry would make that preopen
# read-only — right for `plan`, wrong for the artifact, because `rename` moves folders and
# `keepTimestamp` writes their times back.
allowed_paths = [
  "{operation:pathsText}",
]
allowed_hosts = []
# ADR-0068's vocabulary as closed by ADR-0071. SNF imports three of the nine names: the cooperative
# yield, the event stream, and disk admission for the rename loop. The four `xiranite.fs.*` names that
# used to sit here (stat/list/move/set_times) are gone rather than renamed — the fourth of them
# (`set_times`) has no WASI preview1 syscall and is tracked as an open host dependency in
# `src/std_file_system.rs`, not smuggled back in as a tenth capability.
host_functions = [
  "xiranite.operation.checkpoint",
  "xiranite.operation.emit",
  "xiranite.scheduler.acquire",
]
