[package]
name = "dissolvef"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "DissolveF node core as the node's single WASM business implementation (ADR-0069): nested/media/archive/direct folder dissolution with conflict planning and undo history."

[lib]
name = "dissolvef"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vocabulary and ABI codes only; this crate stays dependency-free so the same types
# compile into the wasm plugin and into the host (ADR-0068).
xiranite-plugin-api = { path = "../../xiranite-plugin-api" }
