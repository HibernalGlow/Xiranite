name: CI

# `workflow_dispatch` exists because every step of the `rust-host` job was written from commands measured on a
# developer machine and nothing ever ran them in the cloud: the pushed branch tip `a94b5500` fails at
# `bun install --frozen-lockfile` in 17 seconds on all four jobs, so no cargo step has any cloud evidence at
# all. A manual trigger makes "does this job pass?" answerable without inventing a push.
#
# ADR-0082 (2026-10-06): the daily development machine is macOS only, so the Windows and Linux legs of the
# `rust-host` matrix and the `ts-faces` job are how bugs on those operating systems get *found*. That only
# works if the working branch triggers them, so `xiranite-rust-rewrite` — the branch AGENTS.md pins all
# rewrite commits to — is now a push target next to `master`. `workflow_dispatch` stays for an on-demand run
# against any ref (`gh workflow run ci.yml --ref <branch>`).
on:
  pull_request:
  push:
    branches:
      - master
      - main
      - xiranite-rust-rewrite
  workflow_dispatch:

# Nothing here writes to the repository, and no token is exposed to a build script.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Bounded so a hung bundler or a `Blocking waiting for file lock` cargo run fails the run instead of
    # occupying a runner for the six-hour default.
    timeout-minutes: 30
    env:
      TURBO_CACHE_DIR: .turbo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # First thing that runs, before a dependency is installed or a cache is restored. This workflow has
      # already shipped steps naming crates the same commit did not carry (`-p quickjs-realm` at `a94b5500`,
      # whose workspace resolved to 14 members with neither crate), and seconds of `cargo metadata` is the
      # cheapest possible place to say so. Invoked through Bun, not `node`: executing a `.ts` file directly
      # needs Node's type stripping, which is default-on only from 22.18 / 23.6, and no runner image's `node`
      # version is ours to assume.
      - name: Every build target this workflow names must exist
        run: bun run audit:ci-build-targets

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'packages/**/package.json', 'packages/**/tsconfig.json', 'packages/**/src/**', 'scripts/**') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.job }}-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-${{ github.job }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate node registries
        run: bun run generate:node-registries

      - name: Audit React Compiler boundaries
        run: bun run audit:react-compiler-boundaries

      - name: Lint
        run: bun run lint

      - name: Build node packages
        run: bun run build:nodes

      - name: Build packages
        run: bun run build:packages:turbo

      # Runs after the workspace packages are built: tsconfig.app.json resolves @xiranite/* through each
      # package's dist/*.d.ts, so typechecking before this step grades an incomplete tree.
      - name: Typecheck app against the ratcheted baseline
        run: bun run audit:typecheck-baseline

      - name: Audit target node manifest
        run: bun run audit:target-node-manifest

      - name: Test target node manifest surface scan
        run: bun run test:target-node-manifest

      - name: Inventory the legacy HTTP/Operation surface
        run: bun run audit:http-surface -- --side legacy --force

      - name: Test the plugin manifest gate
        run: bun run test:plugin-manifests

      - name: Test the node definition gate
        run: bun run test:node-definitions

      - name: Audit node definition coverage
        run: bun run audit:node-definitions

      - name: Test the node UI independence gate
        run: bun run test:node-ui-independence

      - name: Audit node UI independence from Xiranite-only state
        run: bun run audit:node-ui-independence

      # AGENTS.md counts these two books together: `audit:node-ui-independence` scans the `src/nodes/`
      # directory, `audit:node-gui-flavor` walks the real entry-point closure with ast-grep. Neither one alone
      # is the rule about node UI independence, and until now neither closure half ran in CI. Measured on this
      # machine before being committed: 14 tests pass (16.2 s) and the audit answers
      # `30 entries … closure imports {coupling 0, seam 0, sibling 0}`.
      - name: Test the node GUI flavor gate
        run: bun run test:node-gui-flavor

      - name: Audit each node's GUI entry-point closure
        run: bun run audit:node-gui-flavor

      # AGENTS.md mandates this check for every change and CI never ran it. Read the status honestly: it is
      # green at the committed content — the two files over 1000 lines sit exactly on their recorded base
      # there (`src/index.css` 1603/1603, `packages/tauri-migrate/src/node-feasibility.ts` 1142/1142, from
      # `git show HEAD:<path> | wc -l`) — and it is red on this machine's working tree right now because an
      # in-flight lane grew those same two files by +11 and +9 lines without re-basing the ratchet. So expect
      # this step to fail the moment that lane lands, for the reason the rule states: a historical file that
      # exceeds 1000 lines must not keep growing. Fix it by splitting, not by editing this step.
      - name: Check source-file sizes against the ratchet
        run: bun run check:source-size

      # The MD3 token table is generated from `@material/web` and is imported by the design-theme layer;
      # `--check` compares it without writing (measured here: rc=0, `8 sys groups / 84 sets / 3495 tokens`).
      - name: MD3 token table matches its producer
        run: bun run audit:md3-tokens

      - name: Test the node help text gate
        run: bun run test:node-help-text

      - name: Audit node definition help text against the node dictionaries
        run: bun run audit:node-help-text
      - name: Test the node interaction parity gate
        run: bun run test:node-interaction-parity

      - name: Audit each node's interaction.ts against its definition
        run: bun run audit:node-interaction-parity

      - name: Test the node CLI surface inventory
        run: bun run test:node-cli-surface

      - name: Audit the node CLI surface against its baseline
        run: bun run audit:node-cli-surface

      - name: Test the TUI theme table generator
        run: bun run test:tui-theme-table

      - name: Audit the TUI theme table against its producer
        run: bun run audit:tui-theme-table

      - name: Test the migration analyzers
        run: bun run --cwd packages/tauri-migrate test

      - name: Audit node architecture
        run: bun run audit:node-architecture

      # `test:quickjs-host-ops` and `audit:quickjs-host-ops` are not here, and the reason is a cost that was
      # invisible: the gate reads the host vocabulary from the *compiled* `HostOperation::ALL`, so it runs
      # `cargo build --bin print-host-ops` against `xiranite-quickjs-executor`. In this job that meant a cold
      # build of the executor's whole graph (rquickjs and its C sources, xiranite-core, native-host, the
      # czkawka core) once per run, with no Rust toolchain step and no cargo cache, to serve one printed list.
      # It now runs in `rust-host`, right after the two steps that build that same graph.

  # ADR-0082: the TypeScript faces are the layer whose behaviour on another operating system a macOS dev box
  # can least derive — path separators, case-insensitive volumes, `node:` builtins under a bare `bun` runner
  # (ADR-0075 bans Bun-only APIs precisely so this layer has to run elsewhere), and the QuickJS shims.
  # The state before this job, measured rather than recalled: `verify` runs lint, typecheck, builds and the
  # audit gates' own tests, but the file contains no `test:unit` and no `test:packages` step, so the TS test
  # body (503 `*.test.ts(x)` files under `src/`, `packages/` and `scripts/`) was never *executed* in CI on any
  # operating system. This job is therefore a first execution venue, which AGENTS.md now allows explicitly
  # instead of requiring a target-machine measurement first.
  #
  # A red here is the output, not a broken gate: `master` carries no branch protection (measured 2026-10-06 —
  # `gh api repos/HibernalGlow/Xiranite/branches/master/protection` answers 404 "Branch not protected"), so a
  # failing Windows leg reports without stopping a merge.
  #
  # NOT wired here, on purpose: `audit:no-bun-apis` (ADR-0075's gauge, and it did run nowhere in CI before
  # this note). It answers **rc=1 on this machine today** — 6 hits in 5 files, all dev-time tooling
  # (`scripts/audit-node-bundles.ts:426`, `scripts/audit-quickjs-host-ops.ts:356`,
  # `scripts/generate-host-capabilities.ts:30`, `spikes/capabilities-realm-probe/run.ts:33` and `:54`). That
  # makes it a debt ledger rather than a gate, and AGENTS.md's rule is not to put a known-red step into a new
  # job — here it would also starve both suites below it on every run. The same report names 14
  # `packages/nodes/*/src/cli.visual.test.ts` files that no script currently runs, which is part of what this
  # job exists to close; wiring the ledger first would bury that finding under its own red.
  ts-faces:
    name: TypeScript faces (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Bounded above `verify`'s 30 minutes because this job runs the suites that job does not.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate node registries
        run: bun run generate:node-registries

      # The suites import each package's built `dist/`, and a stale shared-package `dist` is a failure mode
      # this repository has already been bitten by (the consumer reports "no such export" while the package's
      # own tests read `src/` and stay green). Build first, exactly as `verify` does.
      - name: Build the packages the suites import
        run: bun run build:packages:turbo

      # The app suite: `vite.config.ts:367` sets `environment: "happy-dom"` and `include: src/**/*.test.{ts,tsx}`.
      #
      # Both suite steps carry `if: !cancelled()` so a red in one cannot starve the other. This job exists to
      # *report* cross-OS failures; the default "first failed step ends the job" would turn one known-red suite
      # into permanent silence about the other — the exact asymmetry ADR-0082 §决策 2 accepts when it lets CI be
      # a test's first execution venue.
      - name: Run the app unit tests
        if: ${{ !cancelled() }}
        run: bun run test:unit -- --maxWorkers=1

      # Per-package suites, including every node's core logic. `scripts/run-turbo.ts:24` sizes concurrency from
      # the runner's own parallelism and free memory, so this needs no `--maxWorkers` argument of its own.
      - name: Run the per-package test suites
        if: ${{ !cancelled() }}
        run: bun run test:packages:turbo

  # The desktop host is Rust now (cargo build -p xiranite-desktop), so the only Go left in the
  # module is the browser-extension native messaging host under cmd/ and internal/. This job keeps
  # that cross-compiling for the two platforms a Linux runner can reach; it needs no Bun runtime
  # asset because nothing in Go launches one any more.
  native-host-compile:
    name: Browser native host compiles (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            goos: linux
            goarch: amd64
          - label: windows-x64
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The only Go that ships now is the browser-extension native messaging host: the Wails
      # desktop host, its embedded Bun runtime and the backend subprocess it launched are deleted.
      # The desktop binary is not built here either; `cargo test --locked -p xiranite-desktop
      # --all-targets` in the `rust-host` job covers it, on the one matrix leg it has been measured on.
      #
      # `-mod=readonly` (which is also Go's default) replaces `-mod=mod`: the latter lets the build
      # silently rewrite `go.mod`/`go.sum` to make itself pass, so a requirement that drifted out of the
      # committed module files could never be reported here. Measured on this machine first:
      # `go build -mod=readonly ./cmd/... ./internal/...` answers rc=0 and leaves both files untouched.
      - name: Compile
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -mod=readonly ./cmd/... ./internal/...

  # ADR-0077 puts Findz's Go index core behind a child process the host owns. Before this job
  # nothing in CI compiled it at all: `native/findz-go` is its own module, so the Go job above
  # (`./cmd/... ./internal/...` with CGO_ENABLED=0) never touched it, and the shipped artifact was
  # a hand-built 9 MB archive committed into git — the exact failure mode ADR-0077 retires.
  #
  # `go test` covers the envelope and the frame rules; the smoke step drives the binary over the
  # pipes the host actually uses, because a unit test over an in-memory reader cannot see a
  # response that never flushes or a placement variable that never crosses exec. `timeout` bounds
  # the pipe: a sidecar that stops answering must fail the job rather than hang the runner.
  findz-sidecar:
    name: Findz sidecar compiles, tests and answers on the pipe
    runs-on: ubuntu-24.04
    # Its index is SQLite behind CGo, so the first compile of `mattn/go-sqlite3` is not instant; bounded far
    # below the six-hour default so a hung sidecar cannot sit on a runner.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/findz-go/go.mod
          cache: true

      # CGo is on by default on this runner, and `mattn/go-sqlite3` needs it: this module's index
      # is SQLite, so a CGO_ENABLED=0 build here would be a different program than we ship.
      - name: Test the index core
        working-directory: native/findz-go
        run: go test ./...

      - name: Build the sidecar executable
        working-directory: native/findz-go
        run: go build -o "$RUNNER_TEMP/findz" .

      - name: Smoke the frame protocol over stdio
        shell: bash
        run: |
          set -euo pipefail
          library="$RUNNER_TEMP/library"
          indexes="$RUNNER_TEMP/indexes"
          mkdir -p "$library" "$indexes"
          root="$library"
          out="$RUNNER_TEMP/frames.jsonl"

          printf '%s\n' \
            "{\"requestVersion\":1,\"requestId\":\"ci-1\",\"method\":\"library.open\",\"params\":{\"root\":\"$root\"}}" \
            "{\"requestVersion\":1,\"requestId\":\"ci-2\",\"method\":\"query.archives\",\"params\":{\"libraryId\":\"library-missing\"}}" \
            'this is not json' \
            | XIRANITE_FINDZ_INDEX_DIR="$indexes" timeout 90 "$RUNNER_TEMP/findz" serve > "$out"

          # Three frames in, three answers out — and each with the code that proves it was the
          # refusal we asked for, not merely "some line came back".
          test "$(wc -l < "$out")" -eq 3
          grep -q '"requestId":"ci-1"' "$out"
          grep -q '"ok":true' "$out"
          grep -q '"requestId":"ci-2"' "$out"
          grep -q '"code":"library_not_open"' "$out"
          grep -q '"code":"invalid_request"' "$out"
          # The placement variable must decide where the index lands, and the file must exist.
          grep -q "$indexes/library-" "$out"
          test -n "$(ls -A "$indexes")"
          echo "findz sidecar answered three frames and placed its index under $indexes"

  # This job is the reason the paragraph above it stopped being a promise: until 2026-10-05 this file ran no
  # `cargo` at all while its comments asserted the desktop host was built by "the Rust job", so nothing in CI
  # compiled or tested the QuickJS executor, the scripted node table or the host crate that the whole rewrite
  # is about.
  #
  # `bun run build:node-bundles` is a prerequisite, not decoration: `crates/xiranite-builtin-host/build.rs`
  # stages each node's bundle out of the gitignored `artifacts/node-bundles/`, and on a tree without those
  # files it panics with its own instruction to run that command. Measured, not inferred — a clean checkout
  # of this branch on Windows failed exactly there (docs/migration/quickjs-substrate-evaluation.md §20).
  #
  # Since ADR-0078 the QuickJS substrate is three crates, not one: `quickjs-host-protocol` (the wire
  # vocabulary), `quickjs-realm` (the engine, the `__xrh` bridge, the pump) and the executor (Xiranite's
  # machine: grants, processes, services). Each of the first two gets its own step below — moving the code
  # into a crate without moving the gate would leave the "single place to maintain it" unmeasured.
  #
  # Deliberately NOT covered by a `cargo test --all-targets` on every leg: `-p xiranite-desktop`. It is run on
  # the macOS leg only, because that is the single host it has been measured on. The icon that used to block
  # Windows (`crates/xiranite-desktop/icons/icon.ico`, which `tauri-build` requires and macOS never asks for)
  # is committed on this branch — verified against the pushed tree, not from this comment — but nothing has
  # re-measured the Windows leg since, and the crate is mid-refactor in another lane, so widening this is a
  # measurement to take, not a claim to type here.
  rust-host:
    name: Rust host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Three operating systems, each compiling the workspace's heaviest dependency graph. Bounded well below
    # the six-hour default so a stalled link or a `Blocking waiting for file lock` wait is a red run, not a
    # silently billed one. Generous on purpose: compilation output is not cached (see the registry step), so a
    # cold Windows leg is the slowest thing this repository does in the cloud, and a false red is worse than
    # the waste. Tighten it only against a measured run duration.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # Before `bun install`, before `build:node-bundles`, before any cargo step — so the failure costs seconds
      # on one leg instead of minutes on three. `a94b5500` shipped this job naming `-p quickjs-host-protocol`
      # and `-p quickjs-realm` while that same commit's workspace had 14 members and carried neither crate:
      # the ADR-0078 split went in as workflow-and-docs, with the crates, `[workspace] members` and
      # `Cargo.lock` left uncommitted. `cargo metadata` is the real registry, and it says so.
      - name: Every build target this workflow names must exist
        run: bun run audit:ci-build-targets

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the node bundles the host links
        run: bun run build:node-bundles

      # The checked-in embedding is what `include_str!` compiles into the host, so it can go stale against
      # the TypeScript build without any Rust test noticing — measured twice today, when a concurrent
      # rebuild of `artifacts/node-bundles/` left `crates/xiranite-quickjs-executor/bundles/` behind and only
      # this command reported it. It is deliberately ordered after the build and before any `cargo` step: the
      # check compares the embedded copies against the freshly built artifacts, so on a clean checkout there
      # is nothing to compare until `build:node-bundles` has run.
      - name: The embedded bundles must match what the bundler produces
        run: bun scripts/embed-node-bundles.ts --check

      # Registry downloads and git checkouts only — `target/` is gone from this list on purpose.
      #
      # The key hashed every `.rs` file in the workspace next to `Cargo.lock`, so any source edit missed the
      # primary key and fell back to whatever prefix cache existed; and the entry it tried to store is the
      # whole build directory, which is not a cacheable object at this size: `du -sh target` on the development
      # machine answers 33 GB against a documented per-repository cache budget of 10 GB
      # (docs.github.com/en/actions/reference/limits, GitHub Free column). A cache that cannot be stored is
      # worse than none — it evicts the Bun and Turbo caches that the other jobs actually hit.
      #
      # What is NOT claimed here: this does not cache compilation output, so each leg still compiles its
      # dependencies. The two levers that would, in order of honesty, are sccache with a real cache backend
      # (AGENTS.md already mandates `RUSTC_WRAPPER=sccache` wherever sccache exists — the runner images do not
      # ship it, and installing it is a separate decision with a credential question attached) or
      # `Swatinem/rust-cache`, whose workspace-aware keys do reuse `deps`. Neither is wired on a guess.
      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Strict lints on the crate that carries every cross-platform claim. Not decoration: the recycle-bin
      # service keeps two `restore` bodies behind `cfg`, and the Windows-only one had a `let mut context`
      # that this machine's clippy could not see (`cargo clippy -p xiranite-core` on macOS: zero warnings on
      # the same code). The `windows-latest` leg of this matrix is the only host that runs that arm, which
      # is the reason this step exists.
      #
      # Scoped to `-p xiranite-core --all-targets --no-deps`, the command the repository already mandates.
      # Measured here before being committed: green (`Finished dev profile`), and red with a planted
      # `1usize as usize` (rc=101, naming `clippy::unnecessary_cast`) — so it is not a blind gauge.
      #
      # Deliberately out of this step: `-p xiranite-quickjs-executor` (its tree is mid-refactor and has
      # never been clippy-green from this box) and `-p xiranite-desktop` (see the note on the last step).
      # Widening the list is a per-crate measurement, not a guess.
      - name: Core crate lints strictly
        shell: bash
        run: cargo clippy --locked -j 1 -p xiranite-core --all-targets --no-deps -- -D warnings

      # `-j 1` because the repository builds native code serially (one Cargo job), on a runner whose
      # memory is not ours to size.
      #
      # The core crate is where the per-platform capabilities live (recycle bin, clipboard, traffic
      # counters, power actions), so it is the crate whose claims are about *other* operating systems.
      # Left out of the first version of this job, CI would have shipped every one of them untested:
      # `support()` answers and the error shapes a face renders are all machine-specific code paths that
      # the executor and scripted crates never touch.
      - name: Core capabilities unit tests
        shell: bash
        run: cargo test --locked -p xiranite-core --lib -j 1

      # The live recycle-bin test moves a real file into the machine's trash and puts it back, so it runs
      # only where that is measurable — which is now all three legs. Windows was excluded on the reasoning
      # that the backend goes through `IFileOperation` and needs a shell/COM context a service-run job may
      # not have. Measured on a Windows 11 host instead of reasoned about: over SSH (a session-0,
      # non-interactive process, a stricter shape than a runner) the crate's own `trash_service.rs`,
      # `trash_journal.rs` and `config_paths.rs` were compiled unchanged into a standalone package and
      # `cargo test --test trash_service -- --test-threads=1` answered 4 passed / 0 failed in 0.35 s,
      # including the delete → list → restore round trip. Nothing is left behind: the test restores its own
      # item, and no test in that file purges or empties the bin.
      #
      # Serial on purpose, because the non-mac arm attributes a trashed item by diffing the whole inventory,
      # so two tests sharing the bin race. The compile half is covered on every leg by `cargo clippy
      # --locked -p xiranite-core --all-targets --no-deps` above, measured with a plant rather than by
      # reasoning: a `let probe_value: u32 = "…"` dropped into `crates/xiranite-core/tests/` makes that clippy
      # step answer rc=101 and name `tests/<file>.rs:2` with E0308. Nobody should add a
      # `cargo check --tests` step to "fix" that gap — it would be the same compile, paid for twice.
      - name: Recycle-bin host service against the real trash
        shell: bash
        run: cargo test --locked -p xiranite-core --test trash_service -j 1 -- --test-threads=1

      # The file capability, the recursive walk and the config store are the arms whose behavior is spelled
      # differently on each target — separators, canonical paths, a durable replace under a lock — yet until
      # now every one of this crate's integration suites was *compiled* on all three legs (`--all-targets`
      # in the clippy step above) and *run* on none: only `--lib` and the recycle-bin step ran. Measured
      # before wiring them in: on macOS the five answer 19 + 11 + 8 + 7 + 5 passed / 0 failed, and on a
      # Windows 11 host the two that lift out cleanly (`filesystem_capability`, `config_store`) answered
      # 36 passed / 0 failed natively against the same sources. The remaining three pull in
      # `enumeration` + `operation` + `xiranite-plugin-api`; that fan is liftable too (168 KB of source,
      # and none of these tests are async), but running them here is the durable route, so this step is
      # their first execution on all three targets.
      - name: File capability, enumeration and config store integration tests
        shell: bash
        run: >
          cargo test --locked -p xiranite-core -j 1
          --test filesystem_capability --test file_stream_capability
          --test directory_enumeration --test walk_contract --test config_store

      # Measured from this box before committing, because the note above the core lint step says widening
      # that list is a measurement and not a guess: `cargo test --locked -p quickjs-host-protocol -j 1`
      # answers 5 passed / 0 failed, and `cargo test --locked -p quickjs-realm --all-targets -j 1` answers
      # 25 unit + 5 integration. Those five are `crates/quickjs-realm/tests/embed.rs`, which drives a bundle
      # with only these two crates and no Xiranite type, and they cover the three channels a second project
      # would otherwise re-write: the synchronous text call, both byte directions (a real `Uint8Array`
      # answers `fs.readBytes`; a `Uint8Array` handed to `sendBytes` arrives at the host byte for byte), and
      # the pump settling two awaited host calls in the order the bundle asked.
      #
      # Not a blind gauge: the same clippy command below answered rc=101 with five `needless_borrow` findings
      # before those were fixed, so this step can fail the job.
      #
      # Neither crate carries a `cfg(unix)` / `cfg(windows)` / `cfg(target_os)` arm (measured: zero matches),
      # so unlike `xiranite-core` every matrix leg here compiles and lints the same code.
      - name: QuickJS host protocol unit tests
        shell: bash
        run: cargo test --locked -p quickjs-host-protocol -j 1

      - name: QuickJS realm tests, including the standalone-embed proof
        shell: bash
        run: cargo test --locked -p quickjs-realm --all-targets -j 1

      - name: QuickJS substrate crates lint strictly
        shell: bash
        run: cargo clippy --locked -j 1 -p quickjs-host-protocol -p quickjs-realm --all-targets --no-deps -- -D warnings

      - name: QuickJS executor unit tests
        shell: bash
        run: cargo test --locked -p xiranite-quickjs-executor --lib -j 1

      # Moved here from `verify`, where it cost a cold build of everything above: the gate reads the host
      # vocabulary from the *compiled* `HostOperation::ALL`, so `audit:quickjs-host-ops` runs
      # `cargo build --bin print-host-ops` (its own `-j 1`, and it auto-detects sccache) against the executor
      # crate. In `verify` that was a from-scratch compile of rquickjs with its C sources plus xiranite-core,
      # native-host and the czkawka core in a job with no Rust step and no cargo cache; here it is incremental
      # over the step two lines above (measured on a warm target: `cargo build done in 6.2s`).
      #
      # It needs nothing the host job lacks: the two modules it imports are `packages/quickjs-shims/src/host.ts`
      # (zero imports) and `…/surface.ts` (one `import type`), and that package's `exports` map points at
      # `./src/*.ts`, not at a build directory — so no `build:packages:turbo` is required to run it.
      # Measured before committing: `bun run test:quickjs-host-ops` 25 pass / 0 fail, and the gate answers
      # "host answers 30 · OPERATIONS_V1 declares 29 · shim surfaces call 28" with rc=0.
      # Ubuntu only because that is the leg it ran on before; the other two legs already compile this crate.
      - name: Test the QuickJS host operation audit
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bun run test:quickjs-host-ops

      - name: Audit the QuickJS host operations against the shim surface
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bun run audit:quickjs-host-ops

      - name: Scripted node registration table
        shell: bash
        run: cargo test --locked -p xiranite-scripted-nodes --all-targets -j 1

      - name: Built-in host crate compiles
        shell: bash
        run: cargo check --locked -p xiranite-builtin-host -j 1

      # macOS only, and that limit is a measurement, not a convenience: `cargo test --locked -p
      # xiranite-desktop --all-targets` was run on this machine today and passed (tauri 3.0.0-alpha.4, 2+2
      # tests).
      #
      # The Windows half of that reason has since changed shape: `crates/xiranite-desktop/icons/icon.ico`
      # is now carried (taken from `build/windows/icon.ico`, the art the shipped Windows build already
      # used), so `tauri-build`'s unconditional requirement at `tauri-build/src/lib.rs:913-931` is
      # satisfied on every target that asks for it. What keeps this step mac-only is that nothing has
      # *measured* it on Windows since — and the desktop crate does not compile on any host right now
      # while another lane wires `src/shell.rs` (`__tauri_command_name_*` unresolved), so widening it
      # here would assert a green nobody has seen.
      #
      # Linux has never been attempted from this box and tauri needs webkit2gtk system libraries, so there
      # is no basis to claim it either.
      - name: Tauri desktop crate compiles and its tests run
        if: matrix.os == 'macos-latest'
        shell: bash
        run: cargo test --locked -p xiranite-desktop --all-targets -j 1
