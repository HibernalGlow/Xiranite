# Xiranite's own declaration for this plugin — the frontend-only form of
# `docs/plugin-architecture.md` §2.1. It is what a Plugin Manager would read to register the remote;
# `dist/mf-manifest.json` is the Module Federation runtime's own metadata and is not this file.
#
# Nothing parses it yet. `crates/xiranite-node-runtime/src/manifest.rs` is the reader for the
# `[backend]` half, and a manifest without `[backend]` is a frontend-only plugin, so it never reaches
# that reader — the absence of `[backend]` here is the declaration, not an omission.
id = "poc-frontend"
name = "Xiranite MF POC"
version = "0.1.0"
frontend_api = "1.0"

[frontend]
runtime = "module-federation"
manifest = "dist/mf-manifest.json"
alias = "poc_frontend"
entry_type = "module"
share_scope = "default"
required_api = "1.0"

[[frontend.exposes]]
id = "poc-frontend.entry"
module = "./entry"

[permissions]
filesystem = []
network = []
clipboard = false
backend = false
