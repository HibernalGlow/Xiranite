[package]
name = "xiranite-tui-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Shared TUI layer for node faces (ADR-0069): the focus ring, the key bindings and the theme vocabulary that the legacy OpenTUI screen established. Deliberately dependency-free — a node's tui.rs supplies ratatui rendering, this crate decides what a key means."

[dependencies]
xiranite-plugin-api = { path = "../xiranite-plugin-api" }
# The only dependency is the definition model itself, which carries no dependencies of its own. Ratatui is
# deliberately absent: a widget version belongs to the face that draws, and this crate would otherwise force one
# onto all 41 node screens.

[lib]
name = "xiranite_tui_runtime"
path = "src/lib.rs"
