[package]
name = "xiranite-czkawka-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8", "async"] }
napi-derive = "3"
trash = "=5.2.6"
xiranite-czkawka-core = { path = "../czkawka-core" }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS records the trash location itself (upstream `trash` exposes no list or
# restore there), so it drives `NSFileManager` directly. Feature set matches what
# `trash` already enables, so no extra objects or versions enter the graph.
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSError",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[target.'cfg(windows)'.dependencies]
rayon = "1.11"
trash-core = { version = "=0.3.1", default-features = false, features = ["windows"] }
windows = { version = "=0.56.0", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }
windows-core = "=0.56.0"

[build-dependencies]
napi-build = "2"
