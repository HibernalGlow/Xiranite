[package]
name = "xiranite-slimg-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8", "async"] }
napi-derive = "3"
rayon = "1.11"
slimg-core = "0.6.0"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
