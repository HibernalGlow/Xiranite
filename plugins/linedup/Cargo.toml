[package]
name = "xiranite-plugin-linedup"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Linedup line-subtraction filter as a standalone Xiranite Extism WASM plugin, ported from packages/nodes/linedup."

# Standalone workspace root, the same shape `plugins/snf` and `plugins/transq` use: the node builds,
# tests and locks on its own so a parallel node port cannot disturb it, and so this crate's
# `[profile.release]` (wasm size, not host throughput) stays authoritative. The repository root
# workspace in `Cargo.toml` lists `plugins/*` in `exclude`, and this table is what makes that real
# rather than incidental.
[workspace]

[lib]
name = "xiranite_plugin_linedup"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[features]
default = []
# `wasm` turns on the Extism shell (`src/extism_host.rs`): the `extism:host/env` and
# `extism:host/user` imports plus the `#[unsafe(no_mangle)]` zero-parameter exports. It is gated on
# `target_arch = "wasm32"` in `src/lib.rs` as well, because those imports resolve only inside an
# Extism isolate. The domain core and `src/plugin_entry.rs` stay feature-free so `cargo test` covers
# exactly the code the isolate will run.
wasm = []

[dependencies]
# serde + serde_json: the preserved protocol is camelCase JSON (`nodeRunRequestSchema` in,
# `nodeRunResultSchema` out — ADR-0063 keeps it), and user text reaches it as CJK plus Windows
# path separators. A hand-rolled escaper would be the risky part of this port, not its subject.
# MIT/Apache-2.0, already used by `plugins/snf` and `plugins/timeu`.
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order` is load-bearing, not cosmetic: `analyzeReadLines` returns a JS `Map` whose
# insertion order the CLI's duplicate panel prints in (`cli.ts:365-377`), and `JSON.stringify` of a
# result document keys in that order. A hash-ordered map would reshuffle the panel.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
# `localeCompare(..., { numeric: true, sensitivity: "base" })` (`core.ts:115`) ignores case *and*
# accents at base strength. `str::to_lowercase` covers the case half; the accent half needs Unicode
# canonical decomposition plus combining-mark stripping, which is exactly what this crate provides.
# MIT, already in the repository's registry cache, no transitive dependency beyond `tinyvec`, and it
# replaces a fold we would otherwise hand-write from the Decomposition_Mappings table. The numeric
# chunking and the total tie-break stay ours (`src/natural_order.rs`).
unicode-normalization = "0.1.25"

# wasm-size profile, copied from the sibling plugin crates: `strip` and `opt-level = "s"` keep the
# artifact inside the manifest's memory ceiling. `panic = "abort"` is deliberately NOT set —
# `cargo test --release` must keep catching panics, and Extism already reports a guest panic as a
# host-visible trap (ADR-0066 puts the cancellation guarantee in fuel/epoch, not in unwinding).
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
