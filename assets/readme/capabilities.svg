<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Xiranite capability map</title>
  <desc id="desc">Representative Xiranite nodes grouped into files, media, workflows, and system capabilities.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#294239" stroke-width="1" opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="14" fill="#101916"/>
  <rect x="1" y="1" width="1198" height="428" rx="13" fill="none" stroke="#36584d" stroke-width="2"/>
  <rect width="1200" height="430" rx="14" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="62" fill="#ecf4f1" font-size="40" font-weight="800">能力不是菜单项，而是可组合节点</text>
    <text x="1146" y="58" fill="#93aaa3" font-size="18" font-weight="700" text-anchor="end">REPRESENTATIVE NODE MAP</text>
    <path d="M54 82H1146" stroke="#36584d" stroke-width="2"/>

    <g transform="translate(54 108)">
