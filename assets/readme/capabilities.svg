        <rect x="143" y="57" width="112" height="39" rx="5" fill="#21352e"/><text x="160" y="83" fill="#d8e7e2">Czkawka</text>
        <rect x="267" y="57" width="116" height="39" rx="5" fill="#21352e"/><text x="284" y="83" fill="#d8e7e2">SmartZip</text>
        <rect x="395" y="57" width="107" height="39" rx="5" fill="#21352e"/><text x="416" y="83" fill="#d8e7e2">ClassF</text>
