name: JS Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

# This job only reads the repository and uploads its own build output.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-js:
    name: Build JS bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_CACHE_DIR: .turbo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No `submodules: recursive`: the two `vendor/` clones are third-party checkouts, and nothing in this
        # job reads them — the turbo filters are `./packages/*`, `vite build` inputs are `index` plus
        # `plugin-host`, and the only consumer of `vendor/Xiranite-Nexus` is `scripts/open-nexus-extension.ts`,
        # a dev-time launcher. `verify` still checks submodules out because its `oxlint .` scan counts files
        # under `vendor/` (123 of its findings today come from `vendor/Xiranite-Nexus`); dropping it there
        # would shrink what CI grades, which is a decision rather than a speedup.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Every build target this workflow names must exist
        run: bun run audit:ci-build-targets

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-js-build-${{ github.ref_name }}-${{ hashFiles('bun.lock', 'turbo.json', 'package.json', 'packages/**/package.json', 'packages/**/tsconfig.json', 'packages/**/src/**', 'scripts/**', 'src/**', 'vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-turbo-js-build-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-js-build-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate node registries
        run: bun run generate:node-registries

      - name: Build node packages
        run: bun run build:nodes

      - name: Build package JS
        run: bun run build:packages:turbo

      - name: Typecheck app against the ratcheted baseline
        run: bun run audit:typecheck-baseline

      - name: Build frontend JS
        run: bunx vite build

      # The bundle this job uploads was never graded: `verify` typechecks and builds the *packages*, not the
      # app, and nothing else runs `vite build` except on a tag push. The chunk audit is the check on the
      # artifact this job actually produces — initial-script size against `XIRANITE_MAIN_CHUNK_MAX_BYTES` and
      # the lazy-only list (node entries, tldraw, BlockNote, Dockview, GridStack) that must not be preloaded.
      # Measured here against a freshly built `dist`: rc=0, "1 initial script(s), 48 initial asset references".
      - name: Audit the produced chunks
        run: bun run audit:build-chunks

      - name: Upload JS artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiranite-js-${{ github.ref_name }}
          if-no-files-found: error
          # Only `dist/**`. The second entry this workflow used to carry, `build/wails/xiranite-backend.js`,
          # had no producer left after the Wails/Bun startup layer was deleted (its build step and script
          # went in `0ad11561`), and the path is gitignored (`build/*`) — so on a clean checkout the glob
          # matched nothing and `if-no-files-found: error` failed every tag build at the upload step.
          path: dist/**
