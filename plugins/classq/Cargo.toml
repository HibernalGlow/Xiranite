[package]
name = "xiranite-plugin-classq"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "ClassQ keyword-folder wait routing as a standalone Xiranite Extism WASM plugin, ported from packages/nodes/classq."

# Standalone workspace root, the same reason `plugins/snf/Cargo.toml` states it: a plugin is built with
# `cargo build --target wasm32-wasip1` from its own directory (ADR-0069), never through the root workspace,
# so a change under `crates/` cannot break a plugin build by accident and the lockfile stays per-plugin.
[workspace]

[lib]
name = "xiranite_plugin_classq"
crate-type = ["lib", "cdylib"]

[dependencies]
# serde + serde_json only, matching `plugins/snf`, `plugins/nameu` and `plugins/logx`. The boundary is JSON in
# and JSON out because ADR-0063 keeps the HTTP/Operation payload contract (`ClassqInput`, `ClassqData`,
# `NodeRunResult` field names and casing are the product contract the React layer already speaks), and folder
# names cross that JSON as CJK text. A hand-written parser would be the risky half of the port; `crates/` is
# deliberately NOT a dependency, because a path dependency would tie a per-plugin workspace to root-workspace
# churn and to whatever another agent is doing in `crates/xiranite-plugin-api` today.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ADR-0071: the artifact is `wasm32-wasip1`, because a `wasm32-unknown-unknown` guest cannot see the WASI
# preopens the host grants from `allowed_paths`, and ClassQ's whole job is directory listing plus rename/copy.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
# No `panic = "abort"`: `cargo test --release` must keep working, and Extism already turns a wasm panic into a
# host-visible trap.
