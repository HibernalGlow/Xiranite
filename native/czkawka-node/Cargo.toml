[package]
name = "xiranite-czkawka-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8", "async"] }
napi-derive = "3"
trash = "=5.2.6"
xiranite-czkawka-core = { path = "../czkawka-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.56.0", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
windows-core = "=0.56.0"

[build-dependencies]
napi-build = "2"
