<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xiranite Node App</title>
    <style>
      #node-app-boot {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: #141414;
        color: #f5f5f5;
        font: 14px/1.5 system-ui, sans-serif;
      }
      #node-app-boot[data-state="error"] {
        align-content: center;
        color: #ffb4ab;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="node-app-boot">Starting node application...</div></div>
    <script>
      (() => {
        const boot = document.getElementById("node-app-boot")
        const report = (reason) => {
          if (!boot) return
          const message = reason instanceof Error ? (reason.stack || reason.message) : String(reason || "Unknown startup error")
          boot.dataset.state = "error"
          boot.textContent = `Node application failed to start:\n${message}`
        }
        window.addEventListener("error", (event) => report(event.error || event.message))
        window.addEventListener("unhandledrejection", (event) => report(event.reason))
      })()
    </script>
    <script type="module" src="/src/node-app-main.tsx"></script>
  </body>
</html>
