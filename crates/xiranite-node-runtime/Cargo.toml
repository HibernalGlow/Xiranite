[package]
name = "xiranite-node-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "Shared node runtime: loads <id>.wasm through the Extism adapter, serves xiranite.* capabilities, and drives an operation to its terminal phase (ADR-0069). Used by the Tauri host, by each node CLI and by each node TUI."

[dependencies]
xiranite-plugin-api = { path = "../xiranite-plugin-api" }
xiranite-core = { path = "../xiranite-core" }
xiranite-api = { path = "../xiranite-api" }
xiranite-extism-adapter = { path = "../xiranite-extism-adapter" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# The plugin manifest is TOML (`docs/plugin-architecture.md` §2.1): one document holds the node
# identity plus the `[backend]` and `[frontend]` halves. Same 1.1 line `xiranite-core` already uses
# for `config/xiranite.config.toml`, so this adds no new upstream source and no second `toml` version.
toml = "1.1"
# `xiranite.now` answers ISO-8601 UTC, the spelling `platform.ts:94`'s `new Date()#toISOString()`
# wrote into history rows. chrono 0.4.45 is already in the graph through the desktop host, so this
# adds no new upstream source.
chrono = "0.4"
thiserror = "2.0"
# `xiranite.fs.read` answers one caller-sized byte chunk, and every capability answer is a JSON
# document (ADR-0068: an envelope, so a refusal stays data instead of a trap). base64 is how those
# bytes ride inside that document. 0.22 is already in the root graph (tauri-codegen, wry, usvg,
# image_hasher …) per HEAD's Cargo.lock, so this adds no new upstream source.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# The end-to-end test drives the real Axum router through `tower::ServiceExt`, the same way
# crates/xiranite-api's own tests do, so no HTTP client or listening socket is needed.
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
