[package]
name = "xiranite-plugin-samea"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false
description = "SameA artist-from-archive-name classification as a standalone Xiranite Extism WASM plugin, ported from packages/nodes/samea."

# Standalone workspace root (same shape as plugins/snf and plugins/timeu): ADR-0063 puts ports under
# `plugins/<id>/`, and the root `[workspace]` in the repository Cargo.toml lists its members explicitly
# and `exclude`s every other plugin directory. Without this table a `cargo build` here would resolve
# against whatever workspace owns the directory, so the port would share the host lock file and the
# host's native profile. With it, `cargo test`, `cargo clippy` and
# `cargo build --target wasm32-wasip1` touch only `plugins/samea/Cargo.lock`.
[workspace]

[lib]
# `samea`, not `xiranite_plugin_samea`: a cdylib is named after its lib target, and ADR-0071's staging
# contract (`scripts/build-node-wasm.ts` `findArtifact`) plus
# `crates/xiranite-node-runtime/src/manifest.rs` both resolve `backend.entry` — `samea.wasm` — next to this
# manifest. `plugins/timeu` and `plugins/snf` still ship a lib name that cannot produce the entry file they
# declare; `crates/nodes/dissolvef` (`[lib] name = "dissolvef"`) is the shape that loads, so this port
# follows it and `tests/manifest_contract.rs` pins the equality.
name = "samea"
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[dependencies]
# Justification for not staying std-only:
# * serde + serde_json: the boundary is JSON in and JSON out. ADR-0063 keeps the HTTP/Operation
#   protocol, so `SameaInput`, `SameaData` and `NodeRunResult` field names and camelCase spelling are
#   product contract that a hand-written parser would have to re-invent, and CJK artist names plus
#   backslash-heavy Windows paths arrive inside that JSON. Both crates are already used by every
#   completed port in `plugins/`.
# * regex (default features off, `std` + `unicode` on): `core.ts:213-216` extracts bracketed artist
#   metadata with `/\[([^\[\]]+)\]/g` and `/^(.+?)\s*\(([^()]+)\)$/`, and `regexBlacklist`
#   (`core.ts:248`) evaluates a *user-supplied* ECMAScript pattern. Reimplementing either an
#   unanchored bracket scanner or a regex engine is exactly the generic infrastructure AGENTS.md
#   forbids re-creating, and `regex` 1.13.1 is already pinned in the repository lock files. The
#   `unicode` feature is on rather than ASCII-only because ECMAScript `\s` is Unicode-aware.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode"] }

# Test-only, and deliberately not a normal dependency: `tests/manifest_contract.rs` reads `manifest.toml`
# with the same parser the host uses (`crates/xiranite-node-runtime/Cargo.toml` pins `toml = "1.1"`), so the
# Rust check and the Rust loader agree on what the document says. A dev-dependency never reaches the cdylib,
# so `cargo build --target wasm32-wasip1` does not grow by a single byte.
[dev-dependencies]
toml = "1.1.6"

# Wasm size profile, mirroring `plugins/snf/Cargo.toml`. ADR-0071 moves the delivery target to
# `wasm32-wasip1` (a `wasm32-unknown-unknown` artifact cannot see the preopens the host grants), and
# `panic = "abort"` stays off so `cargo test --release` keeps working and a guest panic remains a
# host-visible trap rather than an unwinding table in the shipped module.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
