        <rect x="28" y="57" width="145" height="39" rx="5" fill="#21352e" stroke="#d88b72"/><text x="42" y="83" fill="#d8e7e2">EnvUConfig</text>
        <rect x="185" y="57" width="105" height="39" rx="5" fill="#21352e"/><text x="202" y="83" fill="#d8e7e2">GitAlso</text>
